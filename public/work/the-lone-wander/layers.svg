<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t">
<title id="t">The Lone Wander's layers: Regions (the places) depend on Simulation (the running scene: the wanderer, the camera, the UI), which depends on World (the truth: facts in, state out, no nodes); all three may use the Host, which owns the scene slot, the UI stack, pause, saves and named timers, with pause derived from the stack.</title>
