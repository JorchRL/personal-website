<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t">
<title id="t">Plain Engine's boundary: the game is a shared library loaded at run time through a C ABI, rebuilt on save and reloaded while it runs with its state kept; the platform layer, an executable, owns main, the loop and the reload, and owns the memory (one mmap block holding the game's state), the backbuffer the game writes pixels into, and raylib for the window, input and GL context.</title>
<text x="48" y="100" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="28" font-weight="600" fill="#0b0c0e" text-anchor="start">GAME</text>
<text x="48" y="134" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#5b6169" text-anchor="start">shared library</text>
<text x="48" y="212" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#464b52" text-anchor="start">C ABI</text>
<line x1="128.5" y1="205" x2="286" y2="205" stroke="#b9bec2" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="48" y="296" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="28" font-weight="600" fill="#0b0c0e" text-anchor="start">ENGINE</text>
<text x="48" y="330" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#5b6169" text-anchor="start">executable</text>
<text x="48" y="408" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#464b52" text-anchor="start">owns</text>
<line x1="115.2" y1="401" x2="286" y2="401" stroke="#b9bec2" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="48" y="500" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="28" font-weight="600" fill="#0b0c0e" text-anchor="start">RESOURCES</text>
<text x="48" y="534" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#5b6169" text-anchor="start">the platform's</text>
<rect x="300" y="60" width="440" height="110" fill="none" stroke="#0b0c0e" stroke-width="2"/>
<text x="324" y="110" font-family="'Schibsted Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#0b0c0e" text-anchor="start">Game</text>
<text x="324" y="148" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="20" font-weight="400" fill="#464b52" text-anchor="start">gameplay, loaded at run time</text>
<path d="M834 115 A34 34 0 1 1 800 81" fill="none" stroke="#ff3f0f" stroke-width="3"/>
<path d="M798 72 L813 81 L798 90 Z" fill="#ff3f0f"/>
<text x="854" y="96" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="21" font-weight="400" fill="#464b52" text-anchor="start">rebuilt on save,</text>
<text x="854" y="124" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="21" font-weight="400" fill="#464b52" text-anchor="start">reloaded while running,</text>
<text x="854" y="152" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="21" font-weight="400" fill="#464b52" text-anchor="start">its state kept</text>
<line x1="520" y1="170" x2="520" y2="226" stroke="#ff3f0f" stroke-width="3"/>
<path d="M511 224 L520 238 L529 224 Z" fill="#ff3f0f"/>
<rect x="300" y="240" width="852" height="120" fill="#0b0c0e" stroke="#0b0c0e" stroke-width="2"/>
<text x="328" y="298" font-family="'Schibsted Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#eef1f2" text-anchor="start">Platform layer</text>
<text x="328" y="338" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="21" font-weight="400" fill="#c3c8cc" text-anchor="start">main · the loop · reload by file identity</text>
<line x1="436" y1="362" x2="436" y2="424" stroke="#ff3f0f" stroke-width="3"/>
<path d="M427 422 L436 436 L445 422 Z" fill="#ff3f0f"/>
<rect x="300" y="438" width="272" height="150" fill="none" stroke="#0b0c0e" stroke-width="2"/>
<text x="320" y="484" font-family="'Schibsted Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#0b0c0e" text-anchor="start">Memory</text>
<text x="320" y="526" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="20" font-weight="400" fill="#464b52" text-anchor="start">one mmap block:</text>
<text x="320" y="552" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="20" font-weight="400" fill="#464b52" text-anchor="start">the game's state</text>
