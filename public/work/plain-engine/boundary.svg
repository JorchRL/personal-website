<text x="610" y="484" font-family="'Schibsted Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#0b0c0e" text-anchor="start">Backbuffer</text>
<text x="610" y="526" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="20" font-weight="400" fill="#464b52" text-anchor="start">pixels the</text>
<text x="610" y="552" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="20" font-weight="400" fill="#464b52" text-anchor="start">game writes</text>
<line x1="1016" y1="362" x2="1016" y2="424" stroke="#ff3f0f" stroke-width="3"/>
<path d="M1007 422 L1016 436 L1025 422 Z" fill="#ff3f0f"/>
<rect x="880" y="438" width="272" height="150" fill="none" stroke="#0b0c0e" stroke-width="2"/>
<text x="900" y="484" font-family="'Schibsted Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#0b0c0e" text-anchor="start">raylib</text>
<text x="900" y="526" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="20" font-weight="400" fill="#464b52" text-anchor="start">window, input,</text>
<text x="900" y="552" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="20" font-weight="400" fill="#464b52" text-anchor="start">GL context</text>
</svg>
