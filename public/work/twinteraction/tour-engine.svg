<title id="t">Twinteraction's tour engine: features such as the chatbot, quizzes, menus and the LTI bridge plug into one engine core through its registry; the core runs a tour defined in JSON and reaches the Matterport SDK, three.js, the host React app and the event system through ports; Moodle courses, outside the app, hold its tours.</title>
