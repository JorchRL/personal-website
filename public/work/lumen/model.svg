<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t">
<title id="t">How Lumen decides what to teach: two explicit models, the subject (concepts and what comes before what) and the learner (evidence folded into mastery, which can fade), feed the planner, which computes what to learn next and why: the frontier of what the learner can learn now. Activities such as a quiz, a drill, a practice test and a Socratic dialogue run as data, and their results come back as evidence about the learner.</title>
<text x="48" y="100" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="28" font-weight="600" fill="#0b0c0e" text-anchor="start">MODELS</text>
<text x="48" y="134" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#5b6169" text-anchor="start">kept, explicit</text>
<text x="48" y="296" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="28" font-weight="600" fill="#0b0c0e" text-anchor="start">PLANNER</text>
<text x="48" y="330" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#5b6169" text-anchor="start">computed</text>
<text x="48" y="500" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="28" font-weight="600" fill="#0b0c0e" text-anchor="start">ACTIVITIES</text>
<text x="48" y="534" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#5b6169" text-anchor="start">kinds as data</text>
